[project]
name = "uas-mission-planner"
version = "0.1.0"
description = "Geospatial data acquisition and UAS mission-planning research core"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "geopandas>=1.1.4",
    "osmnx>=2.1.1",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
